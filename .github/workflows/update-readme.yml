name: Update Profile Stats

on:
  schedule:
    - cron: '10 0 * * *' # Runs at 6:10 AM Bangladesh Time (UTC+6)
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Sync Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_STATS_PATH: trac-stats.json
          GUTENBERG_STATS_PATH: gutenberg-stats.json
          README_PATH: README.md
        run: node scripts/sync.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update profile stats" && git push)
